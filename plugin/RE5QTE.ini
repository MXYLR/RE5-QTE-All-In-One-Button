; RE5 QTE 插件（单键 E）配置文件
; ---------------------------------------------------------------------------
; 放这个文件到游戏根目录（和 re5dx9.exe 同级）；不放也能跑，用下面的默认值。
;
; 默认：所有 QTE 提示都只认 E 键，由你自己按。
;   - 普通按键 QTE（A/B/X…）→ E
;   - 两键组合 QTE（A+X 之类）→ E
;   - 摇杆挣脱/转动类 QTE（被敌人抓住时那种）→ E
; 想改成“不用按、自动完成”，把 [Auto] Enabled 设为 1。

[Auto]
; 0 = 手动按 E（默认）；1 = 全自动，不用按键。
Enabled = 0

; 下面四条决定“哪些提示算 QTE、接受 E（自动时也自动完成）”：
; 被敌人 / Boss 抓住或处于敌人事件动作时出现的提示
Grab = 1

; 掩码里有两个及以上按键位的提示（只可能是 QTE 组合键）
Combo = 1

; 掩码为 0 的特殊输入提示（摇杆转动/挣脱这类，普通按键提示不会是这种）
Special = 1

; 带 strict 标记的提示。实测这一版游戏的提示 strict 一直是 0，默认关闭。
Strict = 0

[General]
; 1 = 启用整个插件，0 = 完全不动游戏（只写日志）
Enabled = 1

; QTE 键。字母 A-Z、数字 0-9、F1-F12，或 0x45 这种虚拟键码。默认 E = 0x45。
Key = E

; Hold = 按住就生效（同一条提示只会被接受一次）；Tap = 只在按下瞬间生效
Mode = Hold

; 0 = 只接管上面四条认定成 QTE 的提示
; 1 = 紧急开关：所有按键提示都接受 E（连开门/捡东西的提示也算）
ForceAll = 0
SingleKey = 1

; QTE 提示上显示的图标（游戏 UI 图集里的编号）：
;   69 = 字母 E（X 提示本来就用 69），0 = 不改游戏原图标
; 想让 QTE 提示显示成 E，保持 69；想恢复原版按键图标，改成 0。
Glyph = 0

; 1 = 只有游戏窗口在前台时这个键才算
ForegroundOnly = 1

; 1 = 记录提示（排查用）。日志在 plugins\RE5QTE.log
Log = 1

; 最多写多少条提示记录
MaxPromptLog = 600
