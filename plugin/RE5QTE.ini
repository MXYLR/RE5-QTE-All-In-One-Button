; RE5 QTE All-In-One-Button
; 把《生化危机 5》里所有 QTE 统一成一个键（默认 E）。
; 放在游戏根目录（re5dx9.exe 旁边）。

[Auto]
; 1 = 不用按键，QTE 自动完成；0 = 手动按 E（默认）
Enabled = 0

; 哪些提示算 QTE（自动 / 手动都会参考这几条）
Grab = 1      ; 敌人事件动作里的提示（抓取挣脱等）
Combo = 1     ; 两键及以上的提示
Special = 1   ; 掩码为 0 的摇杆 / 特殊输入提示
Strict = 0    ; 带 strict 标记的提示（部分剧情 QTE）

[General]
Enabled = 1
; QTE 键：字母 A-Z、数字 0-9、F1-F12，或 0x45 这样的虚拟键码。默认 E。
Key = E
; Hold = 按住就生效（同一条提示只接受一次）；Tap = 只在按下瞬间生效
Mode = Hold
; 1 = 游戏窗口不在前台时不生效
ForegroundOnly = 1
; 1 = 所有按键提示都接受 E（紧急开关，会连开门/拾取一起接管）
ForceAll = 0
; 日志
Log = 1
MaxPromptLog = 600

; 把能识别的 QTE 提示合并成单个 E（改请求的类型 / 分类 / 掩码 / 图标）
SingleKey = 1

; 额外让 E 应答的提示类型（逗号分隔），并把这些类型的提示图标改成字母 E。
; 6 = 濒死时“连按急救”的提示（按 E 等于替你连按）。
; 留空则只按上面的 QTE 规则。
ExtraTypes = 6

; 旧版全局图标覆盖，已废弃，保持 0
Glyph = 0
